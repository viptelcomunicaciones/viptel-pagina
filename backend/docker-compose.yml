services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
      - /home/node/app/.next
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    env_file:
      - .env
    # NOTE: inside Docker the DB host must be host.docker.internal.
    # Adjust DATABASE_URL accordingly (e.g. via a .env override) — never hardcode credentials here.

volumes:
  node_modules:
